# markdownlint's rules for every markdown file here, as rumdl reads them.

[MD013]
# Prose wraps at 80; a table or code block runs as long as it must.
line-length = 80
code-blocks = false
tables = false

[per-file-ignores]
# Claude Code reads the file as one import of AGENTS.md, and nothing else.
"CLAUDE.md" = ["MD041"]
