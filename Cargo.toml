# Mycelium's node and its command, one crate: the library holds the model,
# the store and the socket; the binary is the command line over them.
[package]
name = "mycelium"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A nimble core for agent networks"
repository = "https://github.com/Jitsusama/mycelium"
publish = false

[dependencies]
# Shared files named by their content, fast enough to hash a quest's scratch
# on every change.
blake3 = "1"
# A shared file's bytes in a link's JSON lines.
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# The time, for the ids and times of messages the node sends, and when a
# machine says it leaves.
jiff = { version = "0.2", features = ["serde"] }
# Folder changes, from inotify on Linux and FSEvents on macOS. The 9
# release candidate, for its watch of only the kinds of change asked for
# (`watching`), which 8 has no way to say.
notify = "9.0.0-rc.7"
# A held session's terminal, with the program's controlling terminal set as
# it starts, which needs code the crate's own rules forbid here.
pty-process = { version = "0.5", features = ["async"] }
# Whether a session's process still lives, the moment it ends, the
# machine's name, a joined terminal's raw mode and size, and, for the
# networks test, the processor time a thread took, without a C binding of
# our own.
rustix = { version = "1", features = [
  "event",
  "fs",
  "process",
  "stdio",
  "system",
  "termios",
  "time",
] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
# The composed form a keyboard types (NFC), so a swarm short spelt with
# its accents apart meets the one typed, and two spelt either way are one
# name. Pinned with unicode-security, which builds on it.
unicode-normalization = "=0.1.26"
# Unicode's own rules for telling identifiers apart (UTS #39), for the
# swarm's short names: which characters an identifier may hold, which
# scripts it may mix, and the skeleton two drawn alike share, so a short
# drawn as another team's or as an act is refused. Pinned exactly, as
# each release moves its tables (this one's are Unicode 18's). A short is
# worked out on the node that reads it and isn't sent, so nodes either
# side of a bump only shorten a team's name differently.
unicode-security = "=0.1.3"
# How many of a terminal's cells a name or line takes, as Unicode's East
# Asian Width and emoji presentation say: two for a wide character or an
# emoji, none for a joiner or combining mark, so a table lines up in any
# script on a terminal that draws by them. Pinned exactly, since three
# places hold this release's widths: the swarm's `starts_afresh` copies
# its rules for joining a character to the one before it, and the joiner
# cap in `forage::one_line`, which PROTOCOL's cleaning of `for` names,
# restarts where it gives a cell. Check all three whenever this moves, as
# nodes on either side of a bump would keep different joiners.
unicode-width = "=0.2.3"

# When a process started on macOS, which only libproc's proc_pidinfo says:
# `ps` is setuid and can't run inside a Nix build. Its bindings are written
# by hand into libSystem, so nothing is generated and no library is added.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Paused time, so a test of a long wait waits on nothing.
tokio = { version = "1", features = ["test-util"] }

# How fast the node is, each a program printing what it measured; see
# benches/README.md.
[[bench]]
name = "heard"
harness = false

[[bench]]
name = "many"
harness = false

[[bench]]
name = "unanswered"
harness = false

[[bench]]
name = "watched"
harness = false

[lints.rust]
# Denied rather than forbidden, so the one place pty-process leaves no
# other way, a held program started again on macOS, says why it may.
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

# clippy's own lints and its pedantic group, as core.nix holds its Rust. A
# lint is silenced only with `#[expect]` and its reason, never `#[allow]`.
# The two left out are about a published library's API, which this isn't:
# the errors and panics its docs must name.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
